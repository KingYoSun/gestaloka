name: ${STACK_NAME:?Initialize a deployment}

x-app: &app
  image: ${STACK_NAME}-server
  build:
    context: ../..
    dockerfile: infra/production/Dockerfile
    target: server
  environment: &app-env
    NODE_ENV: production
    DATABASE_URL: postgres://gestaloka:${POSTGRES_PASSWORD}@postgres:5432/gestaloka
    NEO4J_URI: bolt://neo4j:7687
    NEO4J_USER: neo4j
    NEO4J_PASSWORD: ${NEO4J_PASSWORD}
    OPERATIONS_TOKEN_SECRET: ${OPERATIONS_TOKEN_SECRET}
    ORY_KRATOS_PUBLIC_URL: ${ORY_KRATOS_PUBLIC_URL}
    ORY_KRATOS_INTERNAL_URL: http://kratos:4433
    ORY_HYDRA_ADMIN_URL: http://hydra:4445
    HOST: 0.0.0.0
    TRUST_PROXY: "1"
    DEEPSEEK_HARNESS_HOME: /runtime/harness
    BACKUP_CONTROLLER_URL: http://controller:3100
    BACKUP_CONTROLLER_TOKEN: ${CONTROL_TOKEN}
  volumes:
    - runtime-data:/runtime
  networks: [private, egress]
  restart: unless-stopped

services:
  caddy:
    image: ${STACK_NAME}-web
    build:
      context: ../..
      dockerfile: infra/production/Dockerfile
      target: web
      args:
        VITE_USER_APP_URL: ${ORY_APP_URL}
        VITE_ADMIN_APP_URL: ${ORY_ADMIN_APP_URL}
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${HTTP_PORT:-80}:80"
      - "${BIND_ADDRESS:-0.0.0.0}:${HTTPS_PORT:-443}:443"
    volumes:
      - type: volume
        source: configuration
        target: /etc/caddy
        read_only: true
        volume:
          subpath: public
      - caddy-data:/data
      - caddy-config:/config
    networks: [private, ingress]
    restart: unless-stopped

  api:
    <<: *app
    depends_on:
      postgres: { condition: service_healthy }
      neo4j: { condition: service_healthy }
      kratos: { condition: service_healthy }
      hydra: { condition: service_healthy }
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 30

  worker:
    <<: *app
    command: [node, apps/worker/dist/main.js]
    depends_on:
      api: { condition: service_healthy }
    stop_grace_period: 4m

  controller:
    image: ${STACK_NAME}-controller
    build:
      context: ../..
      dockerfile: infra/production/Dockerfile
      target: controller
    env_file: ${CONFIG_ENV_FILE:?}
    environment:
      CONFIG_ENV_FILE: /state/deployment.env
    volumes:
      - controller-state:/state
      - configuration:/configuration
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [private, egress]
    restart: unless-stopped

  postgres:
    image: postgres:17@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
    environment:
      POSTGRES_DB: gestaloka
      POSTGRES_USER: gestaloka
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - app-data:/var/lib/postgresql/data
    networks: [private]
    healthcheck:
      test: [CMD, pg_isready, -U, gestaloka, -d, gestaloka]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  identity-postgres:
    image: postgres:17@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
    environment:
      POSTGRES_USER: ory
      POSTGRES_DB: ory
      POSTGRES_PASSWORD: ${ORY_DATABASE_PASSWORD}
    volumes:
      - identity-data:/var/lib/postgresql/data
      - type: volume
        source: configuration
        target: /docker-entrypoint-initdb.d
        read_only: true
        volume:
          subpath: init
    networks: [private]
    healthcheck:
      test: [CMD, pg_isready, -U, ory, -d, ory]
      interval: 3s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  neo4j:
    image: neo4j:5.26-community@sha256:0a6e7aedf54a531f76286032d4365ead65b11cca05e4a15cdf23b8e53d6db02b
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 128m
    volumes:
      - graph-data:/data
    networks: [private]
    healthcheck:
      test:
        [CMD-SHELL, 'cypher-shell -u neo4j -p "$${NEO4J_AUTH#*/}" "RETURN 1"']
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 15s
    restart: unless-stopped

  kratos-migrate:
    image: &kratos oryd/kratos:v26.2.0@sha256:2a13bb8d362c7a7ae33bd7c0f5168aee46921f15c916a06346db91c06dc76643
    command: migrate sql -e --yes
    environment: &kratos-env
      DSN: postgres://ory:${ORY_DATABASE_PASSWORD}@identity-postgres:5432/kratos?sslmode=disable
    networks: [private]
    depends_on:
      identity-postgres: { condition: service_healthy }

  kratos:
    image: *kratos
    user: "1000:1000"
    command: serve --config /etc/config/kratos.json
    environment:
      <<: *kratos-env
      SECRETS_COOKIE: ${KRATOS_COOKIE_SECRET}
      SECRETS_CIPHER: ${KRATOS_CIPHER_SECRET}
    volumes:
      - type: volume
        source: configuration
        target: /etc/config
        read_only: true
        volume:
          subpath: ory
    networks: [private, egress]
    depends_on:
      kratos-migrate: { condition: service_completed_successfully }
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:4434/health/ready]
      interval: 3s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  hydra-migrate:
    image: &hydra oryd/hydra:v26.2.0@sha256:ff67c7fb5f95074fa53374d41151713554960504b340cd3f95b09e65deaea2a9
    command: migrate sql -e --yes
    environment: &hydra-env
      DSN: postgres://ory:${ORY_DATABASE_PASSWORD}@identity-postgres:5432/hydra?sslmode=disable
    networks: [private]
    depends_on:
      identity-postgres: { condition: service_healthy }

  hydra:
    image: *hydra
    user: "1000:1000"
    command: serve all --config /etc/config/hydra.json
    environment:
      <<: *hydra-env
      SECRETS_SYSTEM: ${HYDRA_SYSTEM_SECRET}
      OIDC_SUBJECT_IDENTIFIERS_PAIRWISE_SALT: ${HYDRA_PAIRWISE_SALT}
    volumes:
      - type: volume
        source: configuration
        target: /etc/config
        read_only: true
        volume:
          subpath: ory
    networks: [private, egress]
    depends_on:
      hydra-migrate: { condition: service_completed_successfully }
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:4445/health/ready]
      interval: 3s
      timeout: 5s
      retries: 30
    restart: unless-stopped

networks:
  ingress:
  private:
    internal: true
  egress:
    internal: ${ISOLATED_NETWORK:-false}

volumes:
  app-data:
  identity-data:
  graph-data:
  runtime-data:
  configuration:
  controller-state:
  caddy-data:
  caddy-config:
