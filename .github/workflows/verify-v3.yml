name: Verify v3
on:
  pull_request:
  push:
    branches: [main]
jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:recovery
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test:deployment
      - run: pnpm env:init
      - run: pnpm db:up
      - run: pnpm test:integration
      - run: pnpm auth:up
      - run: pnpm test:auth
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - if: failure()
        run: docker compose logs && docker compose --env-file .env --env-file .env.ory -f compose.yaml -f compose.ory.yaml logs --no-color
      - if: always()
        run: docker compose stop && pnpm auth:stop
